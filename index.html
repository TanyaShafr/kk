<meta name="robots" content="noindex,nofollow,noarchive">
<title>Киберурок · вход</title>
<meta name="description" content="Выбери класс и своё имя — получишь логин, пароль и кнопку входа на учебную платформу Киберурок.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f7fd; --card:#fff; --ink:#12295f; --blue:#1f4fd8; --blue-d:#1a41b4;
  --blue-l:#e9f0ff; --blue-l2:#f5f8ff; --muted:#7488a8; --line:#e0e8f7;
  --green:#12a06a; --green-l:#eaf9f2; --warn:#a9660f; --warn-l:#fff6e8;
}
html,body{margin:0;padding:0}
body{font-family:'Manrope','Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--bg);
  background-image:linear-gradient(#e6ecfa 1px,transparent 1px),linear-gradient(90deg,#e6ecfa 1px,transparent 1px);
  background-size:34px 34px;min-height:100vh;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 48px}

.logo{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.logo .sq{width:40px;height:40px;border-radius:13px;background:var(--blue);display:grid;place-items:center;flex:none}
.logo .sq svg{width:22px;height:22px}
.logo b{display:block;font-size:17px;font-weight:900;letter-spacing:-.02em}
.logo span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}

.card{background:var(--card);border-radius:22px;padding:22px 20px;
  box-shadow:0 10px 30px rgba(22,48,110,.07);border:1px solid var(--line)}
h1{margin:0 0 4px;font-size:25px;font-weight:900;letter-spacing:-.025em}
.sub{margin:0 0 18px;color:var(--muted);font-size:14.5px}

.back{display:inline-flex;align-items:center;gap:7px;margin-bottom:14px;padding:8px 13px 8px 10px;
  border-radius:11px;background:var(--blue-l2);border:1.5px solid var(--line);
  font-size:13.5px;font-weight:800;color:var(--blue)}
.back:hover{border-color:#b9c9ef}

.grades{display:grid;gap:16px}
.grade .gl{font-size:11.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.chip{padding:18px 10px;border-radius:17px;border:2px solid var(--line);background:#fff;
  font-size:26px;font-weight:900;letter-spacing:-.02em;text-align:center;transition:.14s;color:var(--ink)}
.chip small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.chip:hover{border-color:#b9c9ef;transform:translateY(-2px)}

.find{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
  font-size:16px;margin-bottom:12px;background:#fff}
.find:focus{outline:none;border-color:var(--blue)}
.names{display:grid;gap:8px;max-height:58vh;overflow-y:auto;padding:2px}
.nm{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:14px;
  border:2px solid var(--line);background:#fff;font-size:16.5px;font-weight:700;
  text-align:left;width:100%;transition:.12s}
.nm:hover{border-color:#b9c9ef;background:var(--blue-l2)}
.nm .av{flex:none;width:34px;height:34px;border-radius:12px;background:var(--blue-l);
  color:var(--blue);display:grid;place-items:center;font-size:14px;font-weight:900}
.none{padding:22px;text-align:center;color:var(--muted);font-size:15px}

.who{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.who .av{flex:none;width:46px;height:46px;border-radius:15px;background:var(--blue);
  color:#fff;display:grid;place-items:center;font-size:17px;font-weight:900}
.who b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em}
.who span{display:block;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em}

.field{border-radius:18px;border:2px solid #cfdcfb;
  background:linear-gradient(135deg,#f3f7ff,#e9f0ff);padding:16px 18px;margin-bottom:12px}
.field .fl{font-size:11.5px;font-weight:900;letter-spacing:.1em;color:var(--muted)}
.val{font-size:26px;font-weight:900;color:#16307a;letter-spacing:-.01em;
  overflow-wrap:anywhere;margin:4px 0 0;line-height:1.2}
.val.long{font-size:18px;letter-spacing:0}
.pwrow{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.pwv{font-size:24px;font-weight:900;letter-spacing:.08em;color:#16307a;font-variant-numeric:tabular-nums}
.eye{padding:8px 13px;border-radius:12px;border:2px solid #cfdcfb;background:#fff;
  font-size:13.5px;font-weight:800;color:var(--blue)}
.eye:hover{border-color:var(--blue)}
.cp{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;margin-top:11px;
  padding:12px 14px;border-radius:13px;border:2px solid #cfdcfb;background:#fff;
  font-size:15px;font-weight:800;color:var(--blue);transition:.14s}
.cp:hover{border-color:var(--blue)}
.cp svg{width:17px;height:17px;flex:none}
.cp.done{border-color:var(--green);color:var(--green);background:var(--green-l)}
.cp.fail{border-color:#e0a03f;color:var(--warn);background:var(--warn-l)}
.note{margin:-2px 0 12px;font-size:13px;font-weight:700;color:var(--warn);line-height:1.4}

.go{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;margin-top:6px;
  padding:19px 18px;border-radius:17px;background:var(--blue);color:#fff;
  font-size:18px;font-weight:900;letter-spacing:-.01em;text-decoration:none;
  box-shadow:0 10px 26px rgba(31,79,216,.3);transition:.14s}
.go:hover{background:var(--blue-d);transform:translateY(-1px)}
.go svg{width:20px;height:20px;flex:none}
.addr{margin:9px 0 0;text-align:center;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tip{margin:16px 0 0;padding:13px 15px;border-radius:14px;background:var(--blue-l2);
  border:1px solid var(--line);font-size:13.5px;color:var(--muted);line-height:1.5}
.again{display:flex;gap:10px;margin-top:14px}
.again button{flex:1;padding:13px;border-radius:13px;border:2px solid var(--line);
  background:#fff;font-size:14px;font-weight:800;color:var(--blue)}
.again button:hover{border-color:#b9c9ef}
@media(max-width:380px){.wrap{padding:16px 12px 40px}.card{padding:18px 15px}h1{font-size:22px}}
</style>
</head>

/* --- копирование: сначала clipboard API, потом запасной путь --- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0";
    document.body.appendChild(ta);
    if (/ipad|iphone|ipod/i.test(navigator.userAgent || "")) {
      const r = document.createRange();
      r.selectNodeContents(ta);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      ta.setSelectionRange(0, text.length);
    } else { ta.select(); }
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return !!ok;
  } catch (e) { return false; }
}

function copyBtn(kind, label) {
  const c = S.copied || {};
  const done = c.k === kind && c.ok, fail = c.k === kind && !c.ok;
  return `<button class="cp ${done ? "done" : (fail ? "fail" : "")}" data-copy="${kind}">
    ${done ? I_DONE : I_COPY}<span>${done ? "Скопировано" : (fail ? "Не вышло" : esc(label))}</span></button>`;
}

  });
  app.querySelectorAll("[data-name]").forEach(n => n.onclick = () => {
    S.name = n.dataset.name; S.shown = false; S.copied = null; render();
  });
  const back = () => { S.name = null; S.shown = false; S.copied = null; render(); };
  const home = () => { S.cls = null; S.name = null; S.find = ""; S.shown = false; S.copied = null; render(); };
  if (q("toclass")) q("toclass").onclick = home;
  if (q("toclass2")) q("toclass2").onclick = home;
  if (q("toname")) q("toname").onclick = back;
  if (q("toname2")) q("toname2").onclick = back;
  if (q("eye")) q("eye").onclick = () => { S.shown = !S.shown; render(); };

  if (q("find")) {
    const inp = q("find");
    inp.oninput = e => {
      S.find = e.target.value;
      render();
      const again = document.getElementById("find");
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    };
  }

  app.querySelectorAll("[data-copy]").forEach(n => n.onclick = async () => {
    const k = ROSTER[S.cls].find(x => x.name === S.name);
    if (!k) return;
    const kind = n.dataset.copy;
    const ok = await copyText(kind === "pass" ? k.pass : k.login);
    S.copied = { k: kind, ok };
    render();
    if (copyTimer) clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { S.copied = null; render(); }, ok ? 1800 : 5000);
  });
}

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (S.name) { S.name = null; S.shown = false; S.copied = null; render(); }
  else if (S.cls) { S.cls = null; S.find = ""; render(); }
});

render();
</script>
</body>
</html>
